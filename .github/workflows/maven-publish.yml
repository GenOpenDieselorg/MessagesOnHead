name: Build and Release MessagesOnHead Plugin

on:
  push:
    branches: [ "**" ]
    paths:
      - "src/**"
      - "libs/**"
      - "pom.xml"
      - "dependency-reduced-pom.xml"
  pull_request:
    branches: [ "**" ]
    paths:
      - "src/**"
      - "libs/**"
      - "pom.xml"
      - "dependency-reduced-pom.xml"
      - ".github/workflows/maven-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessagesOnHead
          path: target/*.jar

      - name: Read project version
        if: github.event_name == 'push'
        id: project
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: auto-${{ steps.project.outputs.version }}-${{ github.run_number }}-${{ steps.project.outputs.short_sha }}
          RELEASE_NAME: MessagesOnHead ${{ steps.project.outputs.version }} build ${{ github.run_number }}
        run: |
          PLUGIN_JARS=()
          for jar in target/*.jar; do
            if [[ "$(basename "$jar")" != original-* ]]; then
              PLUGIN_JARS+=("$jar")
            fi
          done

          gh release create "$TAG_NAME" "${PLUGIN_JARS[@]}" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes "Automatic plugin release for code change in commit $GITHUB_SHA."
